name: Validate DSA tracker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run monitor tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate and validate registry
        run: |
          npm run data:export
          npm run data:validate
      - name: Run TypeScript tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build production artifact
        run: npm run build
