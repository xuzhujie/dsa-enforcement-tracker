name: Monitor official DSA updates

on:
  schedule:
    - cron: '42 7 * * *'
  workflow_dispatch:

concurrency:
  group: dsa-official-monitor
  cancel-in-progress: false

permissions: {}

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generated registry before monitoring
        run: python scripts/validate_registry.py
      - name: Run monitor regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh official update feed
        run: python scripts/check_updates.py
      - name: Validate generated registry after monitoring
        run: python scripts/validate_registry.py
      - name: Commit and push changed monitor data
        id: publish
        run: |
          git config user.name "dsa-enforcement-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/updates.json public/data/review_queue.json public/data/monitor_runs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh official DSA updates"
          git push origin HEAD:refs/heads/main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: monitor
    if: needs.monitor.outputs.revision != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.monitor.outputs.revision }}
